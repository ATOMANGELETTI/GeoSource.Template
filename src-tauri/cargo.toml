[workspace]
resolver = "2"

[package]
name = "geosource-template"
version = "0.1.0"
description = "GeoSource Tauri Template Desktop Application"
authors = ["GeoSource"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "geosource_template_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-window-state = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.19"
anyhow = "1.0.104"
log = "0.4.33"
fern = { version = "0.7.1", features = ["colored"] }
chrono = "0.4.45"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
