# THIS IS FOR APPLICATION SETTINGS (WINDOW SIZE, THEMES, ECT.)
# Edit these values to customize the application behaviour.
# The app writes defaults here on first launch; changes take effect on next restart
# unless the settings panel is used (which reloads without restarting).
#
# See other/configs/README.md for full documentation.

theme: "polar-night" # Options: polar-night | snow-storm | frost | aurora | system

language: "en" # ISO 639-1 code — e.g. en, fr, de, es

log_level:
  trace: false # Include trace level diagnostics
  debug: false # Include debug level logs
  info: true # Include general info logs
  warn: true # Include warning messages
  error: true # Include error & critical events

window:
  remember_size: true # Restore window dimensions from last session
  start_maximized: false # Override remember_size and launch maximized
  always_on_top: false # Keep window above all other windows
  close_to_tray: false # Close button hides to tray instead of quitting
  minimize_to_tray: false # Minimize button hides window to tray

ui:
  animations_enabled: true # Enable micro-animations & transitions
  show_status_bar: true # Display bottom status bar in UI
  font_size: 13 # Base font size in px
  font: "terminus" # Active font: terminus | fira-code | ubuntu

system:
  hardware_acceleration: true # Enable WebGL and GPU hardware acceleration
  start_with_windows: false # Launch application automatically when Windows boots

gis:
  default_crs: "EPSG:4326" # Default coordinate reference system
  tile_cache_enabled: true # Enable spatial tile caching on disk
  max_spatial_memory_mb: 1024 # Maximum memory allocated for spatial rendering
